name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file exe
        run: dotnet publish src/Shotly/Shotly.csproj -c Release -o publish

      - name: Show size
        shell: pwsh
        run: Get-ChildItem publish | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: Shotly-win-x64
          path: publish/Shotly.exe
          if-no-files-found: error

      # После мержа в main exe публикуется во вкладку Releases (pre-release «latest»),
      # чтобы его можно было скачать одним кликом, без поиска артефактов.
      - name: Publish latest pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest publish/Shotly.exe `
            --prerelease `
            --target $env:GITHUB_SHA `
            --title "Shotly — последняя сборка" `
            --notes "Автоматическая сборка из main (коммит $env:GITHUB_SHA). Скачайте Shotly.exe ниже и запустите: установка не нужна."
