name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained single-file exe
        run: dotnet publish src/Shotly/Shotly.csproj -c Release -o publish

      - name: Show size
        shell: pwsh
        run: Get-ChildItem publish | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: Shotly-win-x64
          path: publish/Shotly.exe
          if-no-files-found: error
